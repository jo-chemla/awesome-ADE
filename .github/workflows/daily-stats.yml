name: Daily activity stats

on:
  schedule:
    # Every day at 04:15 UTC.
    - cron: "15 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # Pushes made with this token don't trigger Deploy, so the job starts it.
  actions: write

concurrency:
  group: daily-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub activity and update snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/update-stats.py

      - name: Commit daily snapshot
        id: commit
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md stats/daily.json stats/stats-history.json stats/star-history.json
          git commit -m "chore: update daily activity stats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.commit.outputs.changed == 'true'

      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          node-version: 22
          cache: pnpm

      # A failed screenshot only leaves yesterday's image, so it can't block the
      # deploy below.
      - name: Refresh the social preview image
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec vite preview --port 4173 --strictPort &
          timeout 30 sh -c 'until curl -sf http://localhost:4173/ > /dev/null; do sleep 1; done'
          node .github/scripts/og-image.mjs http://localhost:4173/ stars-chart.png
          gh release upload og-image stars-chart.png --clobber

      - name: Deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
